<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎥</text></svg>">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo">🎥</div>
                <h1>YouTube Downloader</h1>
                <p>Download any video or audio in high quality</p>
            </div>

            <div class="input-section">
                <div class="url-input-group">
                    <input 
                        type="text" 
                        id="urlInput" 
                        placeholder="Paste YouTube URL here..." 
                        autocomplete="off"
                    >
                    <button id="fetchBtn" onclick="fetchInfo()">
                        <span>🔍</span> Get Info
                    </button>
                </div>
                <div id="urlError" class="error-message"></div>
            </div>

            <div id="loader" class="loader" style="display: none;">
                <div class="spinner"></div>
                <p>Fetching video information...</p>
            </div>

            <div id="videoInfo" class="video-info" style="display: none;">
                <div class="video-preview">
                    <img id="thumbnail" src="" alt="Thumbnail">
                    <div class="video-details">
                        <h2 id="videoTitle">Video Title</h2>
                        <p class="uploader" id="videoUploader">👤 Uploader</p>
                        <p class="views" id="videoViews">👁️ Views</p>
                        <p class="duration" id="videoDuration">⏱️ Duration</p>
                    </div>
                </div>

                <div class="download-section">
                    <div class="format-selector">
                        <label for="formatSelect">Select Quality:</label>
                        <select id="formatSelect">
                            <option value="best">Best Quality (Auto)</option>
                        </select>
                    </div>
                    
                    <div class="download-buttons">
                        <button onclick="downloadVideo()" class="btn btn-video">
                            <span>⬇️</span> Download Video
                        </button>
                        <button onclick="downloadAudio()" class="btn btn-audio">
                            <span>🎵</span> Download Audio (MP3)
                        </button>
                    </div>
                </div>

                <div id="progressBar" class="progress-bar" style="display: none;">
                    <div class="progress-fill" id="progressFill"></div>
                    <p id="progressText">Preparing download...</p>
                </div>
            </div>

            <div id="errorMsg" class="error-message" style="display: none;"></div>
            
            <div class="footer">
                <p>⚠️ Download only content you have rights to</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
