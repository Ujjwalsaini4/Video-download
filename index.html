<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 Edu YouTube Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 35px 30px;
            max-width: 580px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            color: #ff0000;
            font-size: 26px;
            margin-bottom: 2px;
        }

        .sub {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .sub span {
            background: #ffeeee;
            padding: 3px 12px;
            border-radius: 12px;
            color: #cc0000;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            background: #fafafa;
        }

        input[type="text"]:focus {
            border-color: #ff0000;
            background: #fff;
        }

        .btn {
            padding: 14px 28px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn:hover {
            background: #cc0000;
            transform: scale(1.03);
        }

        .btn:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
        }

        .quality-section {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quality-section label {
            background: #f0f0f0;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
            font-weight: 500;
        }

        .quality-section label:hover {
            background: #ddd;
        }

        .quality-section input[type="radio"] {
            display: none;
        }

        .quality-section input[type="radio"]:checked+label {
            background: #ff0000;
            color: white;
        }

        #status {
            text-align: center;
            margin: 10px 0;
            padding: 12px;
            border-radius: 10px;
            display: none;
            font-weight: 500;
            font-size: 14px;
        }

        #status.loading {
            display: block;
            background: #fff3cd;
            color: #856404;
        }

        #status.success {
            display: block;
            background: #d4edda;
            color: #155724;
        }

        #status.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
        }

        #status.info {
            display: block;
            background: #d1ecf1;
            color: #0c5460;
        }

        #videoInfo {
            display: none;
            background: #f8f9fa;
            padding: 18px;
            border-radius: 12px;
            margin-top: 15px;
            text-align: center;
            border: 1px solid #e9ecef;
        }

        #videoInfo img {
            max-width: 100%;
            border-radius: 10px;
            max-height: 200px;
        }

        #videoInfo .title {
            margin-top: 10px;
            font-weight: 600;
            font-size: 15px;
            color: #333;
        }

        #videoInfo .meta {
            font-size: 13px;
            color: #666;
            margin: 5px 0 12px 0;
        }

        .download-link {
            display: inline-block;
            padding: 12px 30px;
            background: #28a745;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 5px;
        }

        .download-link:hover {
            background: #218838;
            transform: scale(1.02);
        }

        .btn-audio {
            background: #6f42c1;
        }

        .btn-audio:hover {
            background: #5a32a3;
        }

        .info-box {
            background: #f8f9fa;
            padding: 14px;
            border-radius: 12px;
            margin-top: 15px;
            font-size: 12px;
            color: #555;
            border-left: 4px solid #ff0000;
            line-height: 1.6;
        }

        .info-box strong {
            color: #cc0000;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #999;
        }

        .footer a {
            color: #ff0000;
            text-decoration: none;
            font-weight: 500;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e9ecef;
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
            display: none;
        }

        .progress-bar .fill {
            height: 100%;
            background: #ff0000;
            width: 0%;
            border-radius: 4px;
            transition: width 0.5s;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            .input-group {
                flex-direction: column;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
            h1 {
                font-size: 22px;
            }
            .quality-section label {
                font-size: 12px;
                padding: 5px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">🎓</div>
        <h1>Edu Downloader</h1>
        <p class="sub">📥 <span>Education Purpose Only</span></p>

        <!-- URL Input -->
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste YouTube URL here..." value="https://youtu.be/">
            <button class="btn" id="downloadBtn">⬇ Download</button>
        </div>

        <!-- Quality Selector -->
        <div class="quality-section">
            <input type="radio" name="quality" id="q720" value="720">
            <label for="q720">720p</label>

            <input type="radio" name="quality" id="q480" value="480" checked>
            <label for="q480">480p</label>

            <input type="radio" name="quality" id="q360" value="360">
            <label for="q360">360p</label>

            <input type="radio" name="quality" id="qaudio" value="audio">
            <label for="qaudio">🎵 Audio</label>
        </div>

        <!-- Status -->
        <div id="status"></div>

        <!-- Progress Bar -->
        <div class="progress-bar" id="progressBar">
            <div class="fill" id="progressFill"></div>
        </div>

        <!-- Video Info -->
        <div id="videoInfo"></div>

        <!-- Info Box -->
        <div class="info-box">
            <strong>📌 How to use:</strong><br>
            1️⃣ Paste any YouTube video URL (lecture, tutorial, etc.)<br>
            2️⃣ Select quality (720p/480p/360p/Audio)<br>
            3️⃣ Click Download and save to your device<br>
            <span style="color:#999;font-size:11px;">⚠️ Internet required • For educational use only</span>
        </div>

        <div class="footer">
            Made with ❤️ for Students &nbsp;|&nbsp; <a href="#" onclick="resetAll();return false;">🔄 Reset</a>
        </div>
    </div>

    <script>
        // ================================================================
        //  🚀 COMPLETE YOUTUBE DOWNLOADER - Working with 3 APIs
        // ================================================================

        const urlInput = document.getElementById('urlInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusDiv = document.getElementById('status');
        const videoInfoDiv = document.getElementById('videoInfo');
        const progressFill = document.getElementById('progressFill');
        const progressBar = document.getElementById('progressBar');

        // Get selected quality
        function getQuality() {
            const selected = document.querySelector('input[name="quality"]:checked');
            return selected ? selected.value : '480';
        }

        // Show status
        function setStatus(msg, type = 'loading') {
            statusDiv.textContent = msg;
            statusDiv.className = type;
            statusDiv.style.display = 'block';
        }

        function hideStatus() {
            statusDiv.className = '';
            statusDiv.style.display = 'none';
        }

        // Progress bar
        function setProgress(percent) {
            progressBar.style.display = 'block';
            progressFill.style.width = percent + '%';
        }

        function hideProgress() {
            progressBar.style.display = 'none';
            progressFill.style.width = '0%';
        }

        // Validate YouTube URL
        function isValidUrl(url) {
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/
            ];
            return patterns.some(p => p.test(url));
        }

        // Extract Video ID
        function extractVideoId(url) {
            const match = url.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([a-zA-Z0-9_-]{11})/);
            return match ? match[1] : null;
        }

        // Reset everything
        function resetAll() {
            hideStatus();
            hideProgress();
            videoInfoDiv.style.display = 'none';
            videoInfoDiv.innerHTML = '';
            downloadBtn.disabled = false;
            downloadBtn.textContent = '⬇ Download';
            urlInput.value = 'https://youtu.be/';
            urlInput.focus();
        }

        // ================================================================
        //  API 1: Vevioz API (Primary)
        // ================================================================
        async function fetchFromVevioz(videoId, quality) {
            const url = `https://api.vevioz.com/api/button/mp3/${videoId}`;
            const resp = await fetch(url);
            if (!resp.ok) throw new Error('Vevioz API failed');
            const data = await resp.json();
            return data;
        }

        // ================================================================
        //  API 2: YT API (Fallback)
        // ================================================================
        async function fetchFromYTAPI(videoId, quality) {
            const url = `https://yt-api.com/api/button/mp3/${videoId}`;
            const resp = await fetch(url);
            if (!resp.ok) throw new Error('YT-API failed');
            const data = await resp.json();
            return data;
        }

        // ================================================================
        //  API 3: Cobalt API (Alternative)
        // ================================================================
        async function fetchFromCobalt(url, quality) {
            const isAudio = quality === 'audio';
            const resp = await fetch('https://api.cobalt.tools/api/json', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    url: url,
                    quality: isAudio ? 'audio' : '720',
                    isAudioOnly: isAudio,
                    downloadMode: 'auto'
                })
            });
            if (!resp.ok) throw new Error('Cobalt API failed');
            const data = await resp.json();
            return data;
        }

        // ================================================================
        //  API 4: Another Free API (Extra Fallback)
        // ================================================================
        async function fetchFromSocialBlade(videoId) {
            const url = `https://socialblade.com/api/youtube/video/${videoId}`;
            const resp = await fetch(url);
            if (!resp.ok) throw new Error('SocialBlade API failed');
            const data = await resp.json();
            return data;
        }

        // ================================================================
        //  MAIN DOWNLOAD FUNCTION
        // ================================================================
        async function downloadVideo() {
            const url = urlInput.value.trim();

            if (!url) {
                setStatus('❌ Please paste a YouTube URL first!', 'error');
                return;
            }

            if (!isValidUrl(url)) {
                setStatus('❌ Invalid YouTube URL! Please check and try again.', 'error');
                return;
            }

            const quality = getQuality();
            const videoId = extractVideoId(url);

            // Disable button
            downloadBtn.disabled = true;
            downloadBtn.textContent = '⏳ Processing...';
            videoInfoDiv.style.display = 'none';
            hideProgress();
            setStatus('🔄 Fetching video details... Please wait.', 'loading');
            setProgress(20);

            try {
                let data = null;
                let source = '';

                // ---- TRY API 1: Vevioz ----
                try {
                    setStatus('🔄 Trying Vevioz API...', 'loading');
                    setProgress(30);
                    data = await fetchFromVevioz(videoId, quality);
                    source = 'Vevioz';
                } catch (e1) {
                    console.log('Vevioz failed:', e1.message);

                    // ---- TRY API 2: YT-API ----
                    try {
                        setStatus('🔄 Trying YT-API (fallback 1)...', 'loading');
                        setProgress(50);
                        data = await fetchFromYTAPI(videoId, quality);
                        source = 'YT-API';
                    } catch (e2) {
                        console.log('YT-API failed:', e2.message);

                        // ---- TRY API 3: Cobalt ----
                        try {
                            setStatus('🔄 Trying Cobalt API (fallback 2)...', 'loading');
                            setProgress(70);
                            data = await fetchFromCobalt(url, quality);
                            source = 'Cobalt';
                        } catch (e3) {
                            console.log('Cobalt failed:', e3.message);

                            // ---- TRY API 4: Direct ----
                            try {
                                setStatus('🔄 Trying direct method...', 'loading');
                                setProgress(80);
                                // Try to get direct video URL
                                const directUrl = `https://www.youtube.com/watch?v=${videoId}`;
                                // Use a different approach
                                const resp = await fetch(
                                    `https://api.yt5s.com/api/convert?url=${encodeURIComponent(directUrl)}&type=mp4`
                                );
                                if (resp.ok) {
                                    const dData = await resp.json();
                                    if (dData && dData.url) {
                                        data = { url: dData.url, title: dData.title || 'Video' };
                                        source = 'YT5s';
                                    } else {
                                        throw new Error('No URL in response');
                                    }
                                } else {
                                    throw new Error('Direct API failed');
                                }
                            } catch (e4) {
                                console.log('All APIs failed');
                                throw new Error(
                                    'All download APIs failed. Please try:\n1. Check internet connection\n2. Try again in 2 minutes\n3. Use ssyoutube.com manually'
                                );
                            }
                        }
                    }
                }

                setProgress(90);

                // ================================================================
                //  PROCESS RESPONSE
                // ================================================================

                // Check if we have a download URL
                let downloadUrl = null;
                let title = 'Video';
                let thumbnail = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

                // Parse different API response formats
                if (data) {
                    // Vevioz / YT-API format
                    if (data.url) {
                        downloadUrl = data.url;
                        title = data.title || 'Video';
                        thumbnail = data.thumbnail || thumbnail;
                    }
                    // Cobalt format
                    else if (data.downloadUrl || data.url) {
                        downloadUrl = data.downloadUrl || data.url;
                        title = data.filename || data.title || 'Video';
                    }
                    // YT5s format
                    else if (data.link) {
                        downloadUrl = data.link;
                        title = data.title || 'Video';
                    }
                    // Generic fallback
                    else if (data.data && data.data.url) {
                        downloadUrl = data.data.url;
                        title = data.data.title || 'Video';
                    }
                }

                if (!downloadUrl) {
                    throw new Error('No download URL found in response. Please try again.');
                }

                setProgress(100);

                // ================================================================
                //  SHOW VIDEO INFO & DOWNLOAD LINK
                // ================================================================

                const duration = data.duration || data.length || 'N/A';

                videoInfoDiv.innerHTML = `
                        <img src="${thumbnail}" alt="Thumbnail" onerror="this.src='https://img.youtube.com/vi/${videoId}/mqdefault.jpg'">
                        <div class="title">📹 ${title}</div>
                        <div class="meta">⏱ Duration: ${duration} | Quality: ${quality} | Source: ${source}</div>
